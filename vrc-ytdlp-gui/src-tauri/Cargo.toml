[package]
name = "vrc-ytdlp-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "process", "fs", "time", "net"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
